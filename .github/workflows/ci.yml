name: Cross-platform research desktop checks
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt
        run: python -m pip install -r requirements.txt
      - name: Compile C engine (Unix)
        if: runner.os != 'Windows'
        run: cc -O2 -std=c11 -Wall -Wextra engine/health.c -lm -o engine/ip4_health
      - name: Compile C engine (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /nologo /O2 /W4 /Fe:engine\ip4_health.exe engine\health.c
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt widget smoke test (Linux, headless)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py
      - name: Qt widget smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        run: python tests/smoke_gui.py
